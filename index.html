<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Feliz Cumpleaños Gigi ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            height: 100dvh; /* Ideal para celulares y iPad */
            background-color: #050108;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: white;
            overflow: hidden;
            position: fixed; /* Evita rebotes de scroll en iOS/iPadOS */
        }

        /* CONTROL DE PANTALLAS */
        .screen {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            justify-content: center;
            align-items: center;
        }

        .screen.active {
            display: flex;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* =========================================
           PANTALLA 1: VIDEO ADAPTADO A MÓVIL Y IPAD
           ========================================= */
        #video-screen {
            background-color: #070508;
            flex-direction: column;
            padding: 12px;
        }

        /* Mantiene proporción exacta 16:9 para que el corazón nunca se desfase de tus manos */
        .video-container {
            position: relative;
            width: min(96vw, calc(82dvh * 16 / 9));
            aspect-ratio: 16 / 9;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 0 35px rgba(255, 20, 100, 0.28);
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 14px;
        }

        /* Botón por si el celular/iPad bloquea el autoplay con sonido */
        .play-overlay {
            position: absolute;
            inset: 0;
            background: rgba(10, 2, 12, 0.65);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 25;
            cursor: pointer;
            transition: opacity 0.4s ease;
        }

        .play-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .play-btn-initial {
            background: rgba(255, 25, 100, 0.85);
            color: white;
            border: 1px solid rgba(255, 180, 200, 0.6);
            padding: 14px 26px;
            border-radius: 30px;
            font-size: clamp(15px, 3.5vw, 18px);
            font-weight: 600;
            box-shadow: 0 0 25px rgba(255, 25, 100, 0.7);
            animation: pulseBtn 1.6s infinite;
        }

        @keyframes pulseBtn {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }

        /* Corazón pequeño en los últimos 10 segundos (anclado a tus manos) */
        .heart-btn {
            position: absolute;
            top: 62%;
            left: 41%;
            transform: translate(-50%, -50%) scale(0.85);
            background: none;
            border: none;
            font-size: clamp(34px, 6vw, 56px); /* Se adapta al tamaño de celular o iPad */
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: opacity 3s ease-in-out, transform 0.3s ease;
            z-index: 20;
            filter: drop-shadow(0 0 15px #ff1744);
            will-change: opacity, transform;
            padding: 15px; /* Área táctil más cómoda para el dedo */
        }

        .heart-btn.visible {
            opacity: 1;
            pointer-events: auto;
            animation: heartBeat 1.3s infinite;
        }

        @keyframes heartBeat {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.25); }
        }

        /* Botón "saltalo si quieres gigi" adaptado a bordes de celular y iPad */
        .skip-btn {
            position: fixed;
            bottom: max(20px, calc(env(safe-area-inset-bottom) + 14px));
            right: max(20px, calc(env(safe-area-inset-right) + 16px));
            background-color: rgba(25, 10, 20, 0.75);
            color: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(255, 105, 180, 0.5);
            padding: 11px 20px;
            border-radius: 25px;
            font-size: clamp(13px, 2.8vw, 15px);
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.25s ease;
            z-index: 30;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .skip-btn:active, .skip-btn:hover {
            background-color: rgba(255, 20, 100, 0.85);
            transform: scale(0.97);
        }

        /* =========================================
           PANTALLA 2: GALAXIA FLUIDA SIN LAG
           ========================================= */
        #galaxy-screen {
            position: relative;
            background: radial-gradient(circle at center, #180618 0%, #040106 100%);
        }

        #galaxy-canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none; /* Permite girar con 1 dedo y hacer zoom con 2 dedos en celular/iPad */
        }

        .top-title {
            position: absolute;
            top: max(5%, calc(env(safe-area-inset-top) + 18px));
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Georgia', 'Times New Roman', serif;
            font-style: italic;
            font-size: clamp(24px, 5vw, 36px);
            color: #ffffff;
            text-shadow: 0 0 12px rgba(255, 77, 136, 0.95), 0 0 25px rgba(255, 20, 100, 0.6);
            pointer-events: none;
            z-index: 10;
            white-space: nowrap;
        }

        .hint-text {
            position: absolute;
            bottom: max(18px, calc(env(safe-area-inset-bottom) + 12px));
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 420px;
            font-size: clamp(11px, 2.6vw, 13px);
            color: rgba(255, 215, 235, 0.8);
            pointer-events: none;
            z-index: 10;
            text-align: center;
            background: rgba(15, 4, 15, 0.6);
            border: 1px solid rgba(255, 100, 160, 0.25);
            padding: 8px 14px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        /* =========================================
           CARTAS EMERGENTES (RESPONSIVE MÓVIL/IPAD)
           ========================================= */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 1, 8, 0.7);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 50;
            padding: 18px;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .letter-card {
            background: rgba(24, 8, 20, 0.94);
            border: 1px solid rgba(255, 90, 140, 0.55);
            box-shadow: 0 0 35px rgba(255, 30, 100, 0.35);
            border-radius: 20px;
            max-width: 460px;
            width: 100%;
            max-height: 82dvh;
            overflow-y: auto;
            padding: 26px 22px;
            position: relative;
            transform: scale(0.92);
            transition: transform 0.3s ease;
            text-align: left;
        }

        .modal-overlay.open .letter-card {
            transform: scale(1);
        }

        .close-card {
            position: absolute;
            top: 12px;
            right: 14px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 120, 160, 0.35);
            color: #ffb3c6;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 20px;
            line-height: 30px;
            text-align: center;
            cursor: pointer;
        }

        .letter-title {
            font-family: 'Georgia', serif;
            font-style: italic;
            color: #ff6b95;
            font-size: clamp(20px, 4.5vw, 24px);
            margin-bottom: 12px;
            padding-right: 30px;
            text-shadow: 0 0 8px rgba(255, 107, 149, 0.4);
        }

        .letter-body {
            font-size: clamp(14px, 3.4vw, 15.5px);
            line-height: 1.65;
            color: #f5e6eb;
            margin-bottom: 18px;
            white-space: pre-line;
        }

        .letter-sign {
            font-family: 'Georgia', serif;
            font-style: italic;
            text-align: right;
            color: #ff85a8;
            font-size: clamp(14px, 3.4vw, 15.5px);
        }
    </style>
</head>
<body>

    <!-- Librería Three.js y OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- SHADERS EN GLSL (C++ en la GPU para 0 lag en celular y iPad) -->
    <script id="vertexShader" type="x-shader/x-vertex">
        uniform float uTime;
        uniform float uSize;
        attribute float aScale;
        attribute vec3 aRandomness;
        varying vec3 vColor;

        void main() {
            vColor = color;
            vec4 modelPosition = modelMatrix * vec4(position, 1.0);

            float angle = atan(modelPosition.x, modelPosition.z);
            float distanceToCenter = length(modelPosition.xz);
            float angleOffset = (1.0 / (distanceToCenter + 1.5)) * uTime * 0.4;
            angle += angleOffset;

            modelPosition.x = cos(angle) * distanceToCenter + aRandomness.x;
            modelPosition.y += sin(uTime * 1.5 + distanceToCenter) * 0.12 + aRandomness.y;
            modelPosition.z = sin(angle) * distanceToCenter + aRandomness.z;

            vec4 viewPosition = viewMatrix * modelPosition;
            gl_Position = projectionMatrix * viewPosition;

            gl_PointSize = uSize * aScale * (120.0 / -viewPosition.z);
        }
    </script>

    <script id="fragmentShader" type="x-shader/x-fragment">
        varying vec3 vColor;

        void main() {
            float strength = distance(gl_PointCoord, vec2(0.5));
            strength = 1.0 - strength * 2.0;
            strength = clamp(strength, 0.0, 1.0);
            strength = pow(strength, 1.8);

            gl_FragColor = vec4(vColor, strength);
        }
    </script>

    <script>
        /* =========================================================
           1. CONTROL DEL VIDEO EN CELULAR / IPAD / PC
           ========================================================= */
        const surpriseVideo = document.getElementById('surprise-video');
        const playOverlay = document.getElementById('play-overlay');
        const heartButton = document.getElementById('heart-button');
        const skipButton = document.getElementById('skip-button');
        const videoScreen = document.getElementById('video-screen');
        const galaxyScreen = document.getElementById('galaxy-screen');
        const bgMusic = document.getElementById('bg-music');

        let galaxyInitialized = false;

        // Intentar autoplay; si el celular lo permite se oculta el botón inicial
        window.addEventListener('load', () => {
            const playPromise = surpriseVideo.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    playOverlay.classList.add('hidden');
                }).catch(() => {
                    // En iPhone/iPad muestra el botón bonito para iniciar con audio
                    playOverlay.classList.remove('hidden');
                });
            }
        });

        // Al tocar el botón de bienvenida en celular/iPad
        playOverlay.addEventListener('click', () => {
            playOverlay.classList.add('hidden');
            surpriseVideo.play();
        });

        surpriseVideo.addEventListener('play', () => {
            playOverlay.classList.add('hidden');
        });

        // Mostrar el corazón poco a poco en los últimos 10 segundos
        surpriseVideo.addEventListener('timeupdate', () => {
            if (surpriseVideo.duration) {
                const timeLeft = surpriseVideo.duration - surpriseVideo.currentTime;
                if (timeLeft <= 10) {
                    heartButton.classList.add('visible');
                } else {
                    heartButton.classList.remove('visible');
                }
            }
        });

        // Si el video termina, aseguramos que el corazón siga visible para que le pique
        surpriseVideo.addEventListener('ended', () => {
            heartButton.classList.add('visible');
        });

        // Botón "saltalo si quieres gigi"
        skipButton.addEventListener('click', () => {
            playOverlay.classList.add('hidden');
            if (surpriseVideo.duration) {
                surpriseVideo.currentTime = Math.max(0, surpriseVideo.duration - 10);
            } else {
                surpriseVideo.currentTime = 312;
            }
            heartButton.classList.add('visible');
            surpriseVideo.play().catch(() => {});
        });

        // Al picarle al corazón rojo -> pasa a la galaxia
        heartButton.addEventListener('click', () => {
            surpriseVideo.pause();
            videoScreen.classList.remove('active');
            galaxyScreen.classList.add('active');

            bgMusic.play().catch(() => {});

            if (!galaxyInitialized) {
                initGalaxy();
                galaxyInitialized = true;
            }
        });

        /* =========================================================
           2. CARTAS CON SU HISTORIA PERSONAL
           ========================================================= */
        const letters = [
            {
                title: "Mi Botoncito hermosa,",
                text: "Tanto que me decías viejo por tener 20 y mira nada más... ¡oficialmente ya eres una viejita tú también! Bienvenida al club de los 20, mi anciana decrépita favorita.\n\nCelebro tu vida, celebro cada risa y celebro el privilegio tan grande de poder llamarte mi mujer. Te amo con toda mi alma, hoy y siempre.",
                sign: "Feliz cumpleaños, mi Gigi ❤️"
            },
            {
                title: "7 años de mejores amigos a mi todo,",
                text: "Quién iba a pensar cuando nos conocimos en redes sociales que pasaríamos 7 años siendo mejores amigos, compartiendo desveladas, risas y horas jugando juntos, hasta que un día mi corazón simplemente ya no pudo verte solo como una amiga.\n\nSin avisar te convertiste en mi paz, en mi hogar y en el centro de todos mis días.",
                sign: "Tu dúo para toda la vida 🎮❤️"
            },
            {
                title: "De Chihuahua hasta Jiutepec,",
                text: "Vivimos a distancia y aun así el destino jamás pudo separarnos. Cada kilómetro entre Chihuahua y Morelos se queda corto comparado con lo que siento por ti.\n\nQué felicidad tan inmensa fue tenerte aquí en Chihuahua y haber ido hasta Jiutepec para estar contigo. No importa en qué parte del mapa estemos, mi lugar favorito siempre eres tú.",
                sign: "Siempre juntos contra la distancia ✈️"
            },
            {
                title: "Mi Gigi de corazón,",
                text: "Fuimos dos cometas cruzándose por azar que decidieron seguir el mismo camino. Gracias por comentarme aquel día, gracias por estos años a mi lado y por hacerme el hombre más afortunado del universo.\n\nNo necesito otro cielo si en este me toca orbitarte a ti, mi princesa.",
                sign: "Te amo infinitamente, Nahim ❤️"
            }
        ];

        const letterModal = document.getElementById('letter-modal');
        const letterHeader = document.getElementById('letter-header');
        const letterText = document.getElementById('letter-text');
        const letterSignature = document.getElementById('letter-signature');
        const closeModal = document.getElementById('close-modal');
        let currentLetterIndex = 0;

        function openLetterModal(index) {
            const item = letters[index % letters.length];
            letterHeader.textContent = item.title;
            letterText.textContent = item.text;
            letterSignature.textContent = item.sign;
            letterModal.classList.add('open');
        }

        closeModal.addEventListener('click', () => letterModal.classList.remove('open'));
        letterModal.addEventListener('click', (e) => {
            if (e.target === letterModal) letterModal.classList.remove('open');
        });

        /* =========================================================
           3. TEXTURAS LIGERAS PARA FRASES Y PERSONAJES
           ========================================================= */
        function createTextTexture(text, glowColor = '#ff2a85') {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 120;
            const ctx = canvas.getContext('2d');

            ctx.font = 'bold 35px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            ctx.shadowColor = glowColor;
            ctx.shadowBlur = 15;
            ctx.fillStyle = '#ffffff';
            ctx.fillText(text, 256, 60);

            return new THREE.CanvasTexture(canvas);
        }

        function createHelloKittyTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 200;
            canvas.height = 200;
            const ctx = canvas.getContext('2d');

            ctx.save();
            ctx.translate(100, 105);
            ctx.scale(0.78, 0.78);

            ctx.fillStyle = '#ff66a3';
            ctx.beginPath();
            ctx.roundRect(-42, 25, 84, 65, 22);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#221118';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.ellipse(0, -15, 68, 52, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(-58, -42);
            ctx.quadraticCurveTo(-65, -82, -25, -62);
            ctx.moveTo(58, -42);
            ctx.quadraticCurveTo(65, -82, 25, -62);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#ff1744';
            ctx.beginPath();
            ctx.ellipse(22, -55, 16, 12, -0.3, 0, Math.PI * 2);
            ctx.ellipse(52, -42, 16, 12, -0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(37, -48, 9, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#1a0d12';
            ctx.beginPath();
            ctx.ellipse(-30, -10, 5, 8, 0, 0, Math.PI * 2);
            ctx.ellipse(30, -10, 5, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffcc00';
            ctx.beginPath();
            ctx.ellipse(0, 0, 7, 5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#ff2a6d';
            ctx.beginPath();
            ctx.moveTo(0, 42);
            ctx.bezierCurveTo(-22, 22, -38, 48, 0, 74);
            ctx.bezierCurveTo(38, 48, 22, 22, 0, 42);
            ctx.fill();
            ctx.stroke();

            ctx.restore();
            return new THREE.CanvasTexture(canvas);
        }

        function createSpidermanTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 200;
            canvas.height = 200;
            const ctx = canvas.getContext('2d');

            ctx.save();
            ctx.translate(100, 100);
            ctx.scale(0.78, 0.78);

            ctx.fillStyle = '#d50000';
            ctx.beginPath();
            ctx.roundRect(-28, 30, 56, 55, 18);
            ctx.fill();

            ctx.fillStyle = '#e50914';
            ctx.strokeStyle = '#1a0005';
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.ellipse(0, -12, 54, 60, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#0d0d0d';
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(-10, -5);
            ctx.quadraticCurveTo(-42, -32, -38, 8);
            ctx.quadraticCurveTo(-22, 18, -10, -5);
            ctx.moveTo(10, -5);
            ctx.quadraticCurveTo(42, -32, 38, 8);
            ctx.quadraticCurveTo(22, 18, 10, -5);
            ctx.fill();
            ctx.stroke();

            ctx.restore();
            return new THREE.CanvasTexture(canvas);
        }

        /* =========================================================
           4. GALAXIA 3D ADAPTADA A CELULAR, IPAD Y PC
           ========================================================= */
        function getResponsiveCameraTarget() {
            const aspect = window.innerWidth / window.innerHeight;
            if (aspect < 0.65) {
                // Celular en vertical: más lejos para que se vea toda la galaxia completa
                return new THREE.Vector3(0, 13, 39);
            } else if (aspect < 1.0) {
                // iPad en vertical
                return new THREE.Vector3(0, 10, 31);
            } else {
                // iPad en horizontal o PC
                return new THREE.Vector3(0, 8, 25);
            }
        }

        function initGalaxy() {
            const canvas = document.getElementById('galaxy-canvas');
            const scene = new THREE.Scene();

            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 400);
            camera.position.set(0, 20, 52);

            const renderer = new THREE.WebGLRenderer({
                canvas,
                antialias: false,
                powerPreference: "high-performance"
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.06;
            controls.maxDistance = 85;
            controls.minDistance = 8;

            const rotatingObjectsGroup = new THREE.Group();
            scene.add(rotatingObjectsGroup);

            // A) ESPIRAL ESPACIADA Y ULTRA FLUIDA (4,200 partículas en GPU)
            const count = 4200;
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            const scales = new Float32Array(count);
            const randomness = new Float32Array(count * 3);

            const insideColor = new THREE.Color('#ffe6f2');
            const midColor = new THREE.Color('#ff2a85');
            const outsideColor = new THREE.Color('#7b1fa2');

            const branches = 4;
            const maxRadius = 35;
            const spin = 1.25;

            for (let i = 0; i < count; i++) {
                const i3 = i * 3;
                const radius = 2.2 + Math.pow(Math.random(), 1.2) * maxRadius;
                const spinAngle = radius * spin;
                const branchAngle = ((i % branches) / branches) * Math.PI * 2;

                positions[i3] = Math.cos(branchAngle + spinAngle) * radius;
                positions[i3 + 1] = 0;
                positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * radius;

                const spread = 0.42 * radius;
                randomness[i3] = (Math.random() - 0.5) * spread;
                randomness[i3 + 1] = (Math.random() - 0.5) * (spread * 0.35);
                randomness[i3 + 2] = (Math.random() - 0.5) * spread;

                const mixedColor = insideColor.clone();
                if (radius < maxRadius * 0.45) {
                    mixedColor.lerp(midColor, radius / (maxRadius * 0.45));
                } else {
                    mixedColor.copy(midColor).lerp(outsideColor, (radius - maxRadius * 0.45) / (maxRadius * 0.55));
                }

                colors[i3] = mixedColor.r;
                colors[i3 + 1] = mixedColor.g;
                colors[i3 + 2] = mixedColor.b;
                scales[i] = 0.55 + Math.random() * 1.2;
            }

            const galaxyGeo = new THREE.BufferGeometry();
            galaxyGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            galaxyGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            galaxyGeo.setAttribute('aScale', new THREE.BufferAttribute(scales, 1));
            galaxyGeo.setAttribute('aRandomness', new THREE.BufferAttribute(randomness, 3));

            const galaxyShaderMat = new THREE.ShaderMaterial({
                depthWrite: false,
                blending: THREE.AdditiveBlending,
                vertexColors: true,
                transparent: true,
                uniforms: {
                    uTime: { value: 0 },
                    uSize: { value: 6.8 * renderer.getPixelRatio() }
                },
                vertexShader: document.getElementById('vertexShader').textContent,
                fragmentShader: document.getElementById('fragmentShader').textContent
            });

            scene.add(new THREE.Points(galaxyGeo, galaxyShaderMat));

            // B) CORAZÓN CENTRAL LIGERO
            const heartCount = 650;
            const heartPos = new Float32Array(heartCount * 3);
            const heartColors = new Float32Array(heartCount * 3);
            const heartScales = new Float32Array(heartCount);
            const heartRand = new Float32Array(heartCount * 3);
            const hColor = new THREE.Color('#ff1755');

            for (let i = 0; i < heartCount; i++) {
                const t = (i / heartCount) * Math.PI * 2;
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                const scale = 0.21;

                heartPos[i * 3] = x * scale + (Math.random() - 0.5) * 0.35;
                heartPos[i * 3 + 1] = y * scale + 1.6 + (Math.random() - 0.5) * 0.35;
                heartPos[i * 3 + 2] = (Math.random() - 0.5) * 0.45;

                heartColors[i * 3] = hColor.r;
                heartColors[i * 3 + 1] = hColor.g;
                heartColors[i * 3 + 2] = hColor.b;
                heartScales[i] = 1.15;
            }

            const heartGeo = new THREE.BufferGeometry();
            heartGeo.setAttribute('position', new THREE.BufferAttribute(heartPos, 3));
            heartGeo.setAttribute('color', new THREE.BufferAttribute(heartColors, 3));
            heartGeo.setAttribute('aScale', new THREE.BufferAttribute(heartScales, 1));
            heartGeo.setAttribute('aRandomness', new THREE.BufferAttribute(heartRand, 3));

            const heartMat = new THREE.ShaderMaterial({
                depthWrite: false,
                blending: THREE.AdditiveBlending,
                vertexColors: true,
                transparent: true,
                uniforms: {
                    uTime: { value: 0 },
                    uSize: { value: 8.2 * renderer.getPixelRatio() }
                },
                vertexShader: document.getElementById('vertexShader').textContent,
                fragmentShader: document.getElementById('fragmentShader').textContent
            });

            const centerHeart = new THREE.Points(heartGeo, heartMat);
            scene.add(centerHeart);

            // C) FRASES Y PERSONAJES TÁCTILES (Con tamaño cómodo para dedos en móvil y iPad)
            const clickableSprites = [];

            // Esfera invisible en el corazón central para que también abra cartas si Gigi lo toca
            const centerHitBox = new THREE.Sprite(new THREE.SpriteMaterial({ opacity: 0, transparent: true, depthWrite: false }));
            centerHitBox.position.set(0, 1.6, 0);
            centerHitBox.scale.set(6, 6, 1);
            centerHitBox.userData = { letterIndex: 0 };
            scene.add(centerHitBox);
            clickableSprites.push(centerHitBox);

            const phrases = [
                { text: "Te amo, Botoncito ❤️", color: "#ff2a85", radius: 10.5, angle: 0.2, y: 1.6 },
                { text: "Ya tienes 20, viejita 👵", color: "#ff4da6", radius: 14.5, angle: 1.1, y: -1.1 },
                { text: "De Chihuahua a Jiutepec ✈️", color: "#4da6ff", radius: 18.5, angle: 2.0, y: 1.9 },
                { text: "7 años de mejores amigos", color: "#b366ff", radius: 13.5, angle: 2.9, y: -1.4 },
                { text: "El destino no pudo separarnos", color: "#ff2a85", radius: 22.0, angle: 3.7, y: 1.3 },
                { text: "Mi dúo favorito 🎮", color: "#4da6ff", radius: 11.5, angle: 4.5, y: 1.0 },
                { text: "Mi Gigi de corazón", color: "#ff66b3", radius: 20.0, angle: 5.2, y: -1.0 },
                { text: "Eres mi paz y mi hogar", color: "#ff2a85", radius: 16.5, angle: 5.9, y: 1.5 },
                { text: "Feliz cumpleaños, mi mujer", color: "#ff4da6", radius: 24.5, angle: 0.7, y: -0.7 },
                { text: "Bienvenida al club de los 20", color: "#b366ff", radius: 23.5, angle: 2.4, y: 0.9 }
            ];

            phrases.forEach((item, idx) => {
                const tex = createTextTexture(item.text, item.color);
                const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
                const sprite = new THREE.Sprite(mat);
                sprite.position.set(
                    Math.cos(item.angle) * item.radius,
                    item.y,
                    Math.sin(item.angle) * item.radius
                );
                sprite.scale.set(9.0, 2.2, 1); /* Más grandes para leerse y tocarse fácil en celular */
                sprite.userData = { letterIndex: idx };
                rotatingObjectsGroup.add(sprite);
                clickableSprites.push(sprite);
            });

            const helloKittyTex = createHelloKittyTexture();
            const spidermanTex = createSpidermanTexture();

            const characterConfigs = [
                { tex: helloKittyTex, radius: 9.2, angle: 1.6, y: 0.8, size: 3.8, letter: 0 },
                { tex: spidermanTex, radius: 12.8, angle: 3.4, y: 1.1, size: 3.6, letter: 1 },
                { tex: helloKittyTex, radius: 17.5, angle: 4.9, y: -0.6, size: 3.9, letter: 2 },
                { tex: spidermanTex, radius: 21.0, angle: 0.4, y: 0.9, size: 3.7, letter: 3 }
            ];

            characterConfigs.forEach((cfg) => {
                const mat = new THREE.SpriteMaterial({ map: cfg.tex, transparent: true, depthWrite: false });
                const sprite = new THREE.Sprite(mat);
                sprite.position.set(
                    Math.cos(cfg.angle) * cfg.radius,
                    cfg.y,
                    Math.sin(cfg.angle) * cfg.radius
                );
                sprite.scale.set(cfg.size, cfg.size, 1);
                sprite.userData = { letterIndex: cfg.letter };
                rotatingObjectsGroup.add(sprite);
                clickableSprites.push(sprite);
            });

            // Detector táctil optimizado para dedos en celular y iPad
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            let downPos = { x: 0, y: 0, time: 0 };

            window.addEventListener('pointerdown', (e) => {
                downPos.x = e.clientX;
                downPos.y = e.clientY;
                downPos.time = performance.now();
            });

            window.addEventListener('pointerup', (e) => {
                if (!galaxyScreen.classList.contains('active')) return;
                if (letterModal.classList.contains('open')) return;

                // Tolerancia de 18px para toques con el dedo en pantalla táctil
                const moveDist = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
                const tapDuration = performance.now() - downPos.time;
                if (moveDist > 18 || tapDuration > 450) return;

                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(clickableSprites);

                if (intersects.length > 0) {
                    const idx = intersects[0].object.userData.letterIndex;
                    openLetterModal(idx !== undefined ? idx : currentLetterIndex++);
                    currentLetterIndex++;
                }
            });

            // Animación fluida
            const clock = new THREE.Clock();
            let introProgress = 0;
            let targetCamPos = getResponsiveCameraTarget();

            function animate() {
                requestAnimationFrame(animate);
                const elapsedTime = clock.getElapsedTime();

                if (introProgress < 1) {
                    introProgress += 0.012;
                    camera.position.lerp(targetCamPos, 0.04);
                }

                galaxyShaderMat.uniforms.uTime.value = elapsedTime;
                rotatingObjectsGroup.rotation.y = elapsedTime * 0.07;
                centerHeart.rotation.y = elapsedTime * 0.65;

                const pulse = 1 + Math.sin(elapsedTime * 3.2) * 0.05;
                centerHeart.scale.set(pulse, pulse, pulse);

                controls.update();
                renderer.render(scene, camera);
            }

            animate();

            // Si gira el celular o el iPad, reajusta pantalla y distancia de cámara
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                targetCamPos = getResponsiveCameraTarget();
            });
        }
    </script>
</body>
</html>
